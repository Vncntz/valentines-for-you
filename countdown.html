<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message Awaits... 💌</title>
    <link rel="stylesheet" href="countdown-style.css">
</head>
<body>

<div class="container">
    <h1 class="title">A Special Message Awaits You... 💕</h1>
    
    <div class="countdown-section">
        <p class="countdown-label">Opening in:</p>
        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="time-value" id="days">00</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>
    </div>

    <div class="letter-container">
        <div class="letter-wrapper" id="letterWrapper">
            <div class="lock-icon" id="lockIcon">🔒</div>
            <div class="letter-envelope" id="letterEnvelope">
                💌
            </div>
            <div class="lock-message" id="lockMessage">
                Locked until February 14, 2026 at 8:00 PM
            </div>
        </div>
    </div>

    <div class="hint-text">
        <p>✨ Please wait until the countdown ends to reveal your special message! ✨</p>
    </div>
</div>

<script src="countdown-script.js"></script>
</body>
</html>
